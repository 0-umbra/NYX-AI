# Optional: build a debug APK in GitHub Actions, so you never need Android Studio on your phone.
# NOTE: written for Capacitor 7 (needs Java 21). Not run as part of Stage 2 — verify the first run.
name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # CI FIX: The repository's committed "android/" directory contains ONLY launcher icon resources,
      # not a complete Capacitor Android project scaffold. Therefore, "./gradlew" does not exist.
      # In the temporary GitHub Actions checkout only, we:
      # 1. Preserve the existing committed launcher resources.
      # 2. Temporarily move the incomplete "android/" directory out of the way.
      # 3. Run "npx cap add android" using the repository's pinned Capacitor version to generate a genuine Android project.
      # 4. Restore/overlay the preserved NYX launcher resources into the generated Android project.
      # 5. Run "npx cap sync android".
      # 6. Run icon generation and verification.
      # 7. Build the APK using "cd android && ./gradlew assembleDebug".
      # 8. Run packaged APK icon verification and preserve artifact upload with "if: always()".
      - name: Scaffold Capacitor Android project and restore resources
        run: |
          # Preserve existing committed launcher resources
          mkdir -p .tmp_resources
          cp -r android/app/src/main/res/.tmp_resources/ 2>/dev/null || true
          mv android android_incomplete_backup || true
          # Scaffold genuine Capacitor Android project
          npx cap add android
          # Restore/overlay preserved NYX launcher resources into the generated project
          if [ -d .tmp_resources ]; then
            cp -r .tmp_resources/* android/app/src/main/res/ 2>/dev/null || true
            rm -rf .tmp_resources
          fi
          # If the original android/app/src/main/res/ had files not in .tmp_resources (committed), restore them
          if [ -d android_incomplete_backup/app/src/main/res ]; then
            cp -r android_incomplete_backup/app/src/main/res/* android/app/src/main/res/ 2>/dev/null || true
          fi
          # Clean up backup
          rm -rf android_incomplete_backup
          # CI CORRECTION: Change distribution from "gradle-8.11.1-all.zip" to "gradle-8.11.1-bin.zip"
          # and set networkTimeout to "120000" milliseconds in the generated wrapper properties.
          # Apply after "npx cap add android" and before "./gradlew assembleDebug".
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=https://services.gradle.org/distributions/gradle-8.11.1-all.zip|distributionUrl=https://services.gradle.org/distributions/gradle-8.11.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's|networkTimeout=10000|networkTimeout=120000|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Verify @capacitor/status-bar plugin
        run: |
          if [ -d node_modules/@capacitor/status-bar ]; then
            echo "Status bar plugin installed"
          else
            echo "Error: @capacitor/status-bar plugin not installed"
            exit 1
          fi

      - run: npx cap sync android
      # The Android launcher icon is derived from the official logo (src/assets/logo/nyx-mark-512.png)
      # and written into the Android resource tree. This step generates it and verifies it, and it
      # fails the build if any required variant is missing, malformed or not the NYX AI mark, so a
      # broken icon can never be packaged into the APK. Run it after `cap sync`, which may rewrite
      # the resources from resources/.
      - run: node scripts/android-icons.mjs
      - run: cd android && ./gradlew assembleDebug
      # Confirm the icon really is inside the packaged APK, not just in the source tree.
      - run: node scripts/android-icons.mjs --check-apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyx-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
