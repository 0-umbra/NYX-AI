# Optional: build a debug APK in GitHub Actions, so you never need Android Studio on your phone.
# NOTE: written for Capacitor 7 (needs Java 21). Not run as part of Stage 2 — verify the first run.
name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm test
      - run: npm run build
      # The Android platform already exists in the repository (android/).
      # Skip "npx cap add android" and proceed directly to sync.
      - run: npx cap sync android
      # The Android launcher icon is derived from the official logo (src/assets/logo/nyx-mark-512.png)
      # and written into the Android resource tree. This step generates it and verifies it, and it
      # fails the build if any required variant is missing, malformed or not the NYX AI mark, so a
      # broken icon can never be packaged into the APK. Run it after `cap sync`, which may rewrite
      # the resources from resources/.
      - run: node scripts/android-icons.mjs
      - run: cd android && ./gradlew assembleDebug
      # Confirm the icon really is inside the packaged APK, not just in the source tree.
      - run: node scripts/android-icons.mjs --check-apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyx-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
