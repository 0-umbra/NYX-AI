# Optional: build a debug APK in GitHub Actions, so you never need Android Studio on your phone.
# To use it: copy this file to .github/workflows/android-debug.yml on the `develop` branch.
# NOTE: written for Capacitor 7 (needs Java 21). Not run as part of Stage 2 — verify the first run.
name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [develop]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx cap add android        # remove this line once android/ is committed
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
