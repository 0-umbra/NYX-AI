name: Cloudflare Worker Check

on:
  push:
    branches: [develop]
  # Allows cloudflare-deploy.yml to reuse this exact check as a gate before deploying. Declaring
  # the trigger adds no steps and changes no behaviour; the workflow keeps running on every push
  # to develop exactly as before.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Pinned to the commit that triggered the run, never a branch name.
      #
      # `develop` here would be a race: the job would read whatever the branch pointed at when the
      # checkout ran, not the commit the event was raised for. A push landing mid-run could make
      # the checks pass against code that is not being deployed -- or vice versa.
      #
      # `github.sha` is the triggering commit. When this file is run as a reusable workflow via
      # workflow_call, the `github` context belongs to the CALLER, so this resolves to the caller's
      # triggering commit -- the same value the deploy job checks out. That is what makes "we
      # verified exactly what we shipped" true rather than merely intended.
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Compile Worker without deploying
        run: npx wrangler deploy --dry-run
        working-directory: backend
